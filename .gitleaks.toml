# SPDX-License-Identifier: Apache-2.0
#
# gitleaks configuration: the default rules, minus known false positives. The tests use throwaway passwords of
# accounts on throwaway development nodes (`password: "…"` in specs and component tests); they protect nothing.
# Every other file is scanned with the default rules.
title = "tavrn-web"

[extend]
useDefault = true

[[allowlists]]
description = "Throwaway passwords of test accounts"
paths = ['''^e2e/tests/[^/]+\.ts$''', '''^web/src/.+\.test\.tsx?$''']
regexTarget = "line"
regexes = ['''password: "[a-z-]+-?[0-9]+"''']

[[allowlists]]
description = "Debian package names of the Electron installer"
paths = ['''^apps/desktop-electron/electron-builder\.config\.mjs$''']
regexTarget = "line"
regexes = ['''depends: \[''']

[[allowlists]]
description = "Throwaway minisign test key"
# The Tauri CLI's signature of a test feed and the public key of a throwaway key pair whose secret half was discarded
# (key id 502C71651358215B); the test checks that the shell verifies the real signer's output.
paths = ['''^apps/desktop-electron/src/main/minisign\.test\.ts$''']
regexTarget = "line"
regexes = ['''"RURbIVgTZXEsU[A-Za-z0-9+/]+={0,2}",''', '''"dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDUwMkM3MTY1MTM1ODIxNUIK[A-Za-z0-9+/]+={0,2}";''']
