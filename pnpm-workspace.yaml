packages:
  - web
  - e2e
  # The Tauri desktop app (Windows, macOS) and the Electron shell (Linux), docs/DESKTOP.md; the mobile shells join later.
  - apps/desktop
  - apps/desktop-electron
  # The Electron shell's key listener (a Node-API module built with napi-rs, docs/DESKTOP.md "Hotkeys").
  - apps/desktop-electron/native/keywatch

# Only these packages may run install scripts (pnpm >= 12: allowBuilds).
allowBuilds:
  esbuild: true
  # A Windows installer helper electron-builder depends on; the Linux shell never uses it.
  electron-winstaller: false

# Private phase: the @tavrn packages come from their repositories by tag (tavrn-js README, "Installation").
# @tavrn/e2ee and @tavrn/bot depend on their siblings and on @tavrn/crypto through git dependencies, which pnpm
# blocks below the top level by default; the overrides make every package use the same tagged copies (one
# WebAssembly module for the client and @tavrn/e2ee). Once the packages are on npm these become version ranges.
blockExoticSubdeps: false
overrides:
  "@tavrn/sdk": "github:just-tavrn/tavrn-js#3eccd9f2ffaddaeddb5eec3b0d96018d0dc3e192&path:sdk"
  "@tavrn/e2ee": "github:just-tavrn/tavrn-js#3eccd9f2ffaddaeddb5eec3b0d96018d0dc3e192&path:e2ee"
  "@tavrn/crypto": "github:just-tavrn/tavrn-crypto#19ac87b4b42b13ec07e0eec5f8c17a2b47f70f37&path:pkg"
  # Security overrides for @excalidraw/excalidraw 0.18.1 (the newest release; `pnpm audit` must stay clean).
  # Drop each one once Excalidraw ships a release without the problem.
  # - nanoid: Excalidraw pins 3.3.3 exactly (GHSA-mwcw-c2x4-8c55 and three newer advisories: predictable or endless
  #   generation with odd sizes); 3.3.20 is the fixed release of the same minor with the same API.
  "nanoid@>=3.0.0 <3.3.18": "^3.3.20"
  # - The Mermaid converter is never bundled: vite.config.ts aliases it to src/whiteboard/mermaid-stub.ts (the
  #   whiteboard offers no text-to-diagram). Removing it drops Mermaid, KaTeX, Chevrotain and their pinned
  #   nanoid 4.0.2 / lodash-es 4.17.21 / katex 0.16 (all with advisories) from the install, instead of forcing
  #   them across majors.
  "@excalidraw/excalidraw>@excalidraw/mermaid-to-excalidraw": "-"
  # - sass is a leftover build dependency of Excalidraw (its dist ships compiled CSS and never imports sass; the
  #   web client has no Sass sources). Removing it drops chokidar 3 and braces 3.0.3, whose stack-exhaustion
  #   advisory has no fixed release.
  "@excalidraw/excalidraw>sass": "-"
