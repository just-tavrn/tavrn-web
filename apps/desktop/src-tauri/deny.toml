# cargo deny configuration of the desktop shell (`just desktop-check`, desktop.yml). The same allow-list as
# tavrn-node: permissive licenses and MPL-2.0, no (A)GPL/LGPL.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# Mozilla's CA certificate bundle of the updater's TLS stack (rustls via reqwest): data under the permissive
# Community Data License Agreement, not code (the same exception as tavrn-node).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The same bundle in the signalling stack of LiveKit's Rust SDK (the native voice engine, rustls via reqwest and
# tokio-tungstenite): data, not code (the same exception as tavrn-node).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
yanked = "deny"
# Accepted until upstream moves. Review on every dependency update.
ignore = [
    # zbus 5's split crates were merged into zbus 6 (https://github.com/z-galaxy/zbus/issues/2043).
    # These are informational unmaintained advisories, not a reported vulnerability. Tauri's notification and
    # keyring dependencies still require zbus 5. Track tavrn-web#210; remove once those upstreams migrate to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; notification/keyring upstreams still require the zbus 5 stack" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; notification/keyring upstreams still require the zbus 5 stack" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; notification/keyring upstreams still require the zbus 5 stack" },
    # proc-macro-error 1.0 is unmaintained: a build-time macro crate of glib-macros 0.18, part of the GTK 3
    # bindings (gtk-rs 0.18) that Tauri 2's Linux runtime (wry, tao, muda, webkit2gtk) is built on; not part
    # of the app's runtime code, and no Tauri 2 release leaves those bindings yet.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro crate of the GTK 3 bindings under Tauri 2 on Linux" },
]
# Not an ignore, for the record: `cargo audit` also lists RUSTSEC-2024-0429 (glib 0.18 `VariantStrIter`
# unsound) as a warning. Neither this crate nor any dependency in the tree calls `Variant::array_iter_str` or
# uses `VariantStrIter` (checked against the sources), and cargo deny does not report it.

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
