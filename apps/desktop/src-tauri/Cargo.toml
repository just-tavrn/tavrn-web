# The Tauri shell of the desktop app (docs/DESKTOP.md). Its own Cargo workspace: it is not part of any other one.
[workspace]

[package]
name = "tavrn-desktop"
description = "tavrn desktop app: the Tauri shell around the web client"
version = "0.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/just-tavrn/tavrn-web"
publish = false
# The app's version is web/package.json's (tauri.conf.json points at it); this crate version is not used.

[lib]
name = "tavrn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-voice"]
# The native voice engine (src/voice, docs/DESKTOP.md "Voice"): LiveKit's Rust SDK on its prebuilt libwebrtc (downloaded
# by webrtc-sys at build time), the microphone and the speakers through cpal. Without it the commands answer
# `voice.native_unavailable` and the client keeps the browser engine.
native-voice = ["dep:livekit", "dep:cpal", "dep:tokio", "dep:futures-util"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Address first (src/resolve.rs): the discovery document over rustls (the updater's TLS stack) and SRV records.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# OS keychain (keyring ecosystem: the core API with its in-memory mock store, plus the platform stores below).
keyring-core = "1"
# Native notifications (the backend of tauri-plugin-notification, used directly for the click on Linux).
notify-rust = "4.11"
# The native voice engine (feature native-voice): LiveKit's Rust SDK (signalling over rustls with ring, like the updater).
livekit = { version = "0.9.4", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
# Audio devices: PulseAudio (pure Rust client, also PipeWire's server) with ALSA as the fallback on Linux, WASAPI on Windows.
cpal = { version = "0.18", features = ["pulseaudio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# The key listener of the hotkeys (src/keywatch/x11.rs): the X RECORD extension, pure Rust, observes and never grabs.
x11rb = { version = "0.13", default-features = false, features = ["record"] }
# WebRTC and media streams of the WebKitGTK webview (src/media.rs); the version wry uses.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
# The key listener of the hotkeys (src/keywatch/windows.rs): a low-level keyboard hook that passes every key on.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# Close to tray: a second start (launcher, Start menu, a notification click) shows the running app.
tauri-plugin-single-instance = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
