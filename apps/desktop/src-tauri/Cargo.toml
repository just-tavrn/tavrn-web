# The Tauri shell of the desktop app (docs/DESKTOP.md). Its own Cargo workspace: it is not part of any other one.
[workspace]

[package]
name = "tavrn-desktop"
description = "tavrn desktop app: the Tauri shell around the web client"
version = "0.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/just-tavrn/tavrn-web"
publish = false
# The app's version is web/package.json's (tauri.conf.json points at it); this crate version is not used.

[lib]
name = "tavrn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-voice"]
# The native voice engine (src/voice, docs/DESKTOP.md "Voice"): LiveKit's Rust SDK on its prebuilt libwebrtc (downloaded
# by webrtc-sys at build time), the microphone and the speakers through cpal. Without it the commands answer
# `voice.native_unavailable` and the client keeps the browser engine.
native-voice = ["dep:livekit", "dep:cpal", "dep:tokio", "dep:futures-util"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Address first (src/resolve.rs): the discovery document over rustls (the updater's TLS stack) and SRV records.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# The Android app's check for a newer release (src/release.rs); already in the tree through Tauri.
semver = "1"
# base64url of the native passkeys' WebAuthn JSON (src/passkey.rs).
base64 = "0.23"
# Frame keys and keychain secrets are wiped when dropped (src/voice/mod.rs, src/keychain.rs); already in the tree.
zeroize = { version = "1.9", features = ["serde"] }

# Desktop only (Windows, macOS, Linux): the Android app (docs/ANDROID.md) has no tray, hotkeys, keychain, updater, save
# dialog or native voice engine; its platform pieces are Kotlin (src-tauri/gen/android) behind src/android.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2.7"
# Downloads (src/download.rs): the native save dialog; the shell writes the file itself (no fs plugin for the webview).
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.13"
# `tavrn://` links (src/deeplink.rs): the scheme in the Windows installers' registry and the macOS bundle, the links of a
# start and of a second start (through the single-instance plugin's deep-link feature).
tauri-plugin-deep-link = "2"
# OS keychain (keyring ecosystem: the core API with its in-memory mock store, plus the platform stores below).
keyring-core = "1"
# Native notifications (the backend of tauri-plugin-notification, used directly for the click on Linux).
notify-rust = "4.11"
# The native voice engine (feature native-voice): LiveKit's Rust SDK (signalling over rustls with ring, like the updater).
livekit = { version = "0.9.4", default-features = false, features = ["native", "rustls-tls-webpki-roots"], optional = true }
# Audio devices: PulseAudio (pure Rust client, also PipeWire's server) with ALSA as the fallback on Linux, WASAPI on Windows.
cpal = { version = "0.18", features = ["pulseaudio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# The system-wide key listener of the hotkeys (X RECORD on Linux, a low-level keyboard hook on Windows; observes, never
# grabs), shared with the Electron shell's native module.
keywatch = { package = "tavrn-keywatch", path = "../crates/keywatch" }

# The Android app: Mozilla's root certificates for the node discovery (src/resolve.rs; reqwest's platform verifier needs
# a Kotlin component on Android), the same bundle the native voice engine uses on the desktop.
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# WebRTC and media streams of the WebKitGTK webview (src/media.rs); the version wry uses.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
# Passkeys through the Windows WebAuthn API (src/passkey.rs): the types of webauthn.h and the loader of webauthn.dll;
# the version Tauri's Windows runtime already uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_System_LibraryLoader"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# Close to tray: a second start (launcher, Start menu, a notification click) shows the running app.
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
# The voice integration test (tests/voice_livekit.rs) signs LiveKit tokens itself (HS256).
ring = "0.17"
# The native passkeys' JSON must be what tavrn-node's webauthn-rs reads (src/passkey.rs tests).
webauthn-rs-proto = "0.5.5"
base64urlsafedata = "0.5.5"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
