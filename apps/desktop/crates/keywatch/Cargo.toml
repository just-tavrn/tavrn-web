# The system-wide key listener of the desktop shells (docs/DESKTOP.md "The key listener: observe, never grab, never
# log"): the Tauri shell (src-tauri, path dependency) and the Electron shell's native module
# (apps/desktop-electron/native/keywatch) use it. Its own Cargo workspace, like src-tauri.
[workspace]

[package]
name = "tavrn-keywatch"
description = "tavrn desktop: observes the presses and releases of chosen keys system-wide, never grabs them"
version = "0.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/just-tavrn/tavrn-web"
publish = false

[lib]
name = "keywatch"

[target.'cfg(target_os = "linux")'.dependencies]
# The X RECORD extension, pure Rust: observes and never grabs.
x11rb = { version = "0.13", default-features = false, features = ["record"] }

[target.'cfg(windows)'.dependencies]
# A low-level keyboard hook that passes every key on.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
