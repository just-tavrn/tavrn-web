# SPDX-License-Identifier: Apache-2.0
#
# Reviews dependency changes of pull requests: refuses known vulnerabilities and licenses outside the
# allow-list (the same list as scripts/check-js-licenses.mjs). Gated by CI_ENABLED; GitHub
# offers the dependency graph for private repositories only with Advanced Security (docs/GITHUB.md).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    # Private repositories get the dependency graph only with Advanced Security: the job waits for publication.
    if: ${{ vars.CI_ENABLED == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, MIT-0, 0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
            MPL-2.0, Zlib, Unicode-3.0, Unicode-DFS-2016, CC0-1.0, BSL-1.0, Unlicense, CDLA-Permissive-2.0,
            BlueOak-1.0.0, Python-2.0, PSF-2.0
          # BlueOak-1.0.0, Python-2.0 and PSF-2.0: the `allowed` of scripts/js-licenses.config.mjs (permissive, no
          # copyleft; argparse through js-yaml is Python-2.0 up to 3.0.2 and PSF-2.0, the PSF License Agreement alone, from 3.0.3).
          # Exempt from the license check (any version; the action matches the purl without version, ignoring case):
          # - Swatinem/rust-cache (LGPL-3.0): a CI-only action that caches Cargo builds in the workflows; nothing of it
          #   is linked into or shipped with the apps.
          # - brotli-decompressor (Tauri's build-time asset compression): the legacy "BSD-3-Clause/MIT" (both allowed),
          #   which GitHub cannot parse; cargo deny checks its license.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache, pkg:cargo/brotli-decompressor
