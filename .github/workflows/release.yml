# SPDX-License-Identifier: Apache-2.0
#
# Release of the web client and the desktop apps (docs/GITHUB.md "Releases", docs/DESKTOP.md "Builds and releases").
# Push a tag vX.Y.Z (or vX.Y.Z-rc.N, published as a pre-release) whose commit carries that version in web/package.json:
# the workflow checks the tag, runs the checks, builds web/dist and attaches it as tavrn-web-X.Y.Z.tar.gz (with its
# SHA-256 sum) to a GitHub release, so the node's image build can embed a pinned bundle instead of building this
# repository; the release notes start with the table of the downloads. The job `desktop` then builds the desktop apps
# from the tag and attaches the installers, their SHA-256 sums (<asset>.sha256), the updater signatures and feeds to
# the same release (desktop.yml). The website's download page reads the releases through GitHub's API itself.
# Gated by CI_ENABLED.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Tag matches the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          pv="$(node -p "require('./web/package.json').version")"
          if [ "$pv" != "$v" ]; then
            echo "tag $TAG does not match web/package.json version $pv" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Checks (SPDX headers, dependency licenses, typecheck, tests)
        run: |
          scripts/check-spdx.sh
          node scripts/check-js-licenses.mjs
          pnpm -r --if-present typecheck
          pnpm -r --if-present test
      - name: Build web/dist and pack it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @tavrn/web build
          test -f web/dist/index.html
          mkdir -p release
          tar -C web/dist -czf "release/tavrn-web-$VERSION.tar.gz" .
          (cd release && sha256sum "tavrn-web-$VERSION.tar.gz" > "tavrn-web-$VERSION.tar.gz.sha256")
          ls -l release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The table of the downloads (apps/desktop/scripts/release-assets.mjs) in front of GitHub's generated notes.
          node apps/desktop/scripts/release-assets.mjs notes "$TAG" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          # A tag with a hyphen (v1.2.3-rc.1) is a pre-release: never "latest" for the updaters and the download page.
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag "${prerelease[@]}" release/*

  # The desktop apps from the tag (desktop.yml): the Tauri installers for Windows, the Electron packages for Linux and
  # the Electron fallback for Windows, with checksums, signatures and the updaters' feeds, attached to this release.
  desktop:
    name: Desktop installers ${{ github.ref_name }}
    needs: release
    if: ${{ vars.CI_ENABLED == 'true' }}
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/desktop.yml
    with:
      release-tag: ${{ github.ref_name }}
    secrets:
      TAVRN_READ_PAT: ${{ secrets.TAVRN_READ_PAT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
