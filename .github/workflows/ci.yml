# SPDX-License-Identifier: Apache-2.0
#
# Uses the organization's reusable workflows (just-tavrn/.github). Every job is gated by the repository
# variable CI_ENABLED (docs/GITHUB.md): nothing runs until the owner sets it to "true".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one; on main every push finishes (the desktop builds of
# a merge would otherwise be thrown away by the next one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Docs-only changes (Markdown, docs/) run the hygiene jobs only; the builds report themselves as skipped
    # (a passed check). The website picks the documentation up through its source submodules.
    name: What changed
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          desktop=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" "$HEAD")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(^|/)[^/]+\.md$|^docs/'; then code=false; fi
            # The desktop builds (desktop.yml): the apps, the client they embed, the workspace's dependencies.
            if ! printf '%s\n' "$files" | grep -qE '^apps/desktop/|^apps/desktop-electron/|^web/|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$'; then desktop=false; fi
            printf '%s\n' "$files" | head -100
          fi
          [ "$code" = true ] || desktop=false
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "desktop=$desktop" | tee -a "$GITHUB_OUTPUT"

  js:
    name: JavaScript
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/js-ci.yml@main
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      runner: tavrn-heavy
      # SPDX headers and dependency licenses (the reusable workflow's defaults), typecheck of the web client and the
      # end-to-end suite, Vitest (unit, component and the static accessibility checks of web/src/test/a11yStatic.test.ts),
      # then the production bundle web/dist.
      typecheck: pnpm -r --if-present typecheck
      test: pnpm -r --if-present test
      build: pnpm --filter @tavrn/web build && test -f web/dist/index.html
      # On pushes the bundle goes to the desktop job below, which builds the apps from it instead of building it again.
      artifact-name: ${{ github.event_name == 'push' && 'web-dist' || '' }}
      artifact-path: web/dist
      submodules: "false"
    secrets:
      # The @tavrn packages are git dependencies of private repositories until the repositories go public.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  # The desktop apps' Linux checks and packages and the NSIS cross-build (desktop.yml) on pushes to main that touch the
  # apps, the client or the dependencies, with the web/dist the JavaScript job built. desktop.yml's release-assets job
  # (skipped here, it runs for a release tag only) declares the release permissions, which a caller has to grant.
  desktop:
    name: Desktop
    needs: [changes, js]
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.desktop == 'true' }}
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop.yml
    with:
      web-dist-artifact: web-dist
    secrets:
      TAVRN_READ_PAT: ${{ secrets.TAVRN_READ_PAT }}

  publish-check:
    name: Publication hygiene
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private files, domains or secrets
        env:
          # Comma-separated private domains, hosts and addresses (repository or organization secret).
          PUBLISH_CHECK_PRIVATE: ${{ secrets.PUBLISH_CHECK_PRIVATE }}
          # Dependabot's pull requests see only Dependabot secrets; the push to main runs the full check.
          PUBLISH_CHECK_ALLOW_UNCONFIGURED: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && '1' || '' }}
        run: scripts/publish-check.sh

  shared-scripts:
    # The copies of the organization's shared scripts (SPDX check, publication check, labels, JS licenses) are the
    # source in just-tavrn/.github apart from their SPDX line (its docs/GITHUB.md "Shared scripts").
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/shared-scripts.yml@main
