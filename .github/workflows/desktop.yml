# SPDX-License-Identifier: Apache-2.0
#
# The desktop app (docs/DESKTOP.md "Builds and releases"): the Tauri shell for Windows (apps/desktop) and the Electron
# shell for Linux, with its Windows build as the fallback (apps/desktop-electron). Gated by CI_ENABLED (docs/GITHUB.md).
#
# - The self-hosted runner tavrn-heavy (the organization's runner image ships WebKitGTK, xvfb, xdotool, gnome-keyring,
#   livekit-server, cargo-xwin, NSIS and LLVM; the Microsoft CRT and Windows SDK wait in the runner's cache,
#   XWIN_CACHE_DIR) for trusted events only: pushes, manual runs and pull requests from branches of this repository.
#   - `tauri-linux`: the Tauri shell's checks on Linux (cargo fmt, clippy, tests of src-tauri and the key listener
#     crate, cargo deny, a round trip through the real Secret Service); Linux ships the Electron shell, so no bundles.
#   - `windows-nsis`: the Tauri NSIS installer cross-compiled with cargo-xwin (artifact desktop-windows-nsis), so main
#     always has a current Windows installer.
#   - `linux-electron`: the Electron shell's checks, the key listener's Node-API module, .AppImage, .deb and
#     latest-linux.yml, the Playwright specs under xvfb (the full smoke test against the AppImage, the real keyring in
#     a D-Bus session of its own); artifact desktop-linux-electron.
# - GitHub-hosted runners: forks, Dependabot and dependabot/* branches fall back to ubuntu-latest (`windows-nsis` is
#   skipped there); release builds are GitHub-hosted throughout (just-tavrn/.github, runner/README.md "Security"). On
#   windows-latest, by hand or for a release tag: `windows` (the Tauri .msi and NSIS installers, `windows: true`) and
#   `windows-electron` (the Electron fallback's NSIS installer and latest.yml, `electron-windows: true`); on
#   ubuntu-latest `android` (the Android app's APK for 64-bit ARM, unsigned, `android: true`; docs/ANDROID.md); on
#   macos-latest `macos` (the Tauri app, one universal build for Apple Silicon and Intel, not signed or notarized,
#   `macos: true`; continue-on-error: a failed macOS build never fails a release, which then has no macOS files).
# - Release tags: release.yml calls this workflow with `release-tag` after it created the GitHub release; `linux-electron`
#   (on ubuntu-latest), `windows`, `windows-electron`, `android` and `macos` build from the tag WITHOUT any secret, and
#   `release-assets` (environment `release`, the only job that sees the updater key and the Android keystore) signs the
#   Tauri installers (with the macOS app archive), the Electron feeds and the APK,
#   writes the checksums and latest.json, verifies every signature, attests the build provenance, checks the file
#   names against the download page's rules and attaches everything to that release (never a second one). It installs
#   nothing but the Tauri CLI (no lifecycle scripts) and runs no cargo. `tauri-linux` and `windows-nsis` do not run
#   for a release. apps/desktop/scripts/release-workflow.test.mjs keeps it that way.
name: Desktop

on:
  # Development phase (2026-10-08): pull requests run the quick checks of ci.yml only. The Linux checks and packages
  # with their tests and the NSIS cross-build run on pushes to main that touch the apps or the client, and by hand
  # (`gh workflow run desktop.yml --ref <branch>` for a pull request branch whose diff you have read: the self-hosted
  # runner executes that branch's code; dependabot/* branches go to ubuntu-latest). The windows-latest builds only by
  # hand and on release tags. Changes to this file alone start nothing: dispatch to verify.
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - apps/desktop-electron/**
      - web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      windows:
        description: "Also build the Tauri installers on windows-latest (.msi, NSIS)"
        type: boolean
        default: false
      electron-windows:
        description: "Also build the Electron fallback for Windows on windows-latest (NSIS, latest.yml)"
        type: boolean
        default: false
      android:
        description: "Also build the Android app on ubuntu-latest (APK for arm64, unsigned)"
        type: boolean
        default: false
      macos:
        description: "Also build the macOS app on macos-latest (universal .dmg and .app.tar.gz, unsigned)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        description: "The tag whose GitHub release receives the installers and the updater files"
        type: string
        required: true
    secrets:
      TAVRN_READ_PAT:
        required: false
      # The updater key is a secret of the environment `release`, which only `release-assets` declares. release.yml
      # passes both by name (a called workflow gets an environment secret only when the caller passes it); the job
      # with the environment receives the environment's value.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # The Android app's signing key (docs/ANDROID.md "Releases"): the environment `release` as well, release-assets only.
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release-tag || '' }}

jobs:
  # The Tauri shell is Windows' (and later macOS'); its Rust code still builds and is tested on Linux, where the runner
  # has WebKitGTK. No bundles: Linux ships the Electron shell. `just desktop-check` is the local equivalent.
  tauri-linux:
    name: Tauri shell (Linux checks)
    if: ${{ vars.CI_ENABLED == 'true' && !inputs.release-tag }}
    # tavrn-heavy for trusted events (the trust rule of the organization's rust-ci.yml: never forks, Dependabot or
    # dependabot/* branches, whose code would run in the runner VM).
    runs-on: ${{ fromJSON(github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && '["self-hosted","linux","x64","tavrn-heavy"]' || '"ubuntu-latest"') }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub-hosted: install what the runner image of tavrn-heavy ships (the self-hosted job writes nothing into
      # its container's system: no apt, no toolchain setup, no Actions cache; Cargo builds in the cache slot's
      # target directory, CARGO_TARGET_DIR).
      - name: System packages (WebKitGTK, ALSA, gnome-keyring)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          # libasound2-dev: the native voice engine's audio devices (cpal links ALSA).
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev gnome-keyring dbus
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        if: ${{ runner.environment == 'github-hosted' }}
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          tool: cargo-deny
      - name: Tools of the runner image
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          missing=()
          for t in cargo cargo-deny dbus-run-session gnome-keyring-daemon; do
            command -v "$t" >/dev/null || missing+=("$t")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not in the runner image (just-tavrn/.github, runner/Dockerfile): ${missing[*]}"; exit 1
          fi
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(pnpm --version)" = "$want" ] || { echo "::error::the runner image has pnpm $(pnpm --version), package.json wants $want"; exit 1; }
          [ "$(node -p 'process.versions.node.split(".")[0]')" = 24 ] || { echo "::error::the runner image has Node.js $(node --version), the job wants 24"; exit 1; }
          rustc --version && cargo clippy --version && rustfmt --version && node --version
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-unset}"
      - run: pnpm install --frozen-lockfile
      - name: Web client (web/dist, embedded by the shell)
        run: pnpm --filter @tavrn/web build
      - name: Checks (fmt, clippy, tests, cargo deny)
        working-directory: apps/desktop/src-tauri
        run: |
          # The key listener crate shared with the Electron shell (its own Cargo workspace).
          (cd ../crates/keywatch && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked)
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          # Licenses, advisories, bans and sources (deny.toml).
          cargo deny check
      - name: The real Linux keychain (gnome-keyring in a D-Bus session)
        working-directory: apps/desktop/src-tauri
        run: |
          dbus-run-session -- bash -c 'echo ci-keyring | gnome-keyring-daemon --components=secrets --daemonize --unlock >/dev/null && cargo test --locked -- --ignored os_keychain'
      - name: Release scripts (latest.json, checksums, the asset set, the installer licence)
        run: pnpm --filter @tavrn/desktop test

  # The Linux app (apps/desktop-electron, docs/DESKTOP.md "The Linux shell (Electron)", "Builds and releases"): the
  # checks, the key listener's Node-API module, the .AppImage, .deb and latest-linux.yml, the full smoke test against
  # the AppImage (no FUSE: extracted and run) with a second user in Chromium, voice through the node's livekit-server,
  # the global hotkey through xdotool; artifacts desktop-linux-electron and the screenshots. For a release tag on
  # ubuntu-latest, built from the tag: release-assets attaches its packages and feed. The packages and their SHA-256
  # sums are uploaded right after packaging, before anything else is downloaded or run (the node binary and the
  # tools of the specs): the specs test a copy, and release-assets takes only the artifact.
  linux-electron:
    name: Desktop (Linux, Electron)
    if: ${{ vars.CI_ENABLED == 'true' }}
    # tavrn-heavy for trusted events, the same rule as the Tauri job above; forks, Dependabot and releases on ubuntu-latest.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && !inputs.release-tag && '["self-hosted","linux","x64","tavrn-heavy"]' || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    # release-assets downloads the packages by this id: the artifact exactly as uploaded after packaging, never one the
    # later steps of this job (the specs) could have uploaded under the same name.
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      # GitHub-hosted: what the runner image of tavrn-heavy ships (Chromium's libraries through Playwright, xvfb,
      # xdotool, gnome-keyring, livekit-server, Rust); the self-hosted job installs nothing.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        if: ${{ runner.environment == 'github-hosted' }}
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          workspaces: |
            apps/desktop-electron/native/keywatch -> target
            apps/desktop-electron/native/passkeys -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          tool: cargo-deny
      - name: Tools of the runner image
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          missing=()
          for t in cargo cargo-deny xvfb-run xdotool livekit-server docker dbus-run-session gnome-keyring-daemon pkg-config perl make; do
            command -v "$t" >/dev/null || missing+=("$t")
          done
          # The passkeys module finds the security keys through udev (libudev-dev for its build).
          pkg-config --exists libudev || missing+=("libudev-dev")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not in the runner image (just-tavrn/.github, runner/Dockerfile): ${missing[*]}"; exit 1
          fi
          [ "$(node -p 'process.versions.node.split(".")[0]')" = 24 ] || { echo "::error::the runner image has Node.js $(node --version), the job wants 24"; exit 1; }
          rustc --version && node --version && pnpm --version && livekit-server --version
      - run: pnpm install --frozen-lockfile
      - name: System packages (xvfb, xdotool, gnome-keyring, libudev-dev)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool gnome-keyring dbus libudev-dev
          # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts to AppArmor profiles that
          # allow them; the runner VM is thrown away after the job (the self-hosted VM sets the same, runner/README.md).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Web client (web/dist, bundled into the app)
        run: pnpm --filter @tavrn/web build
      - name: Checks (typecheck, node --test, SPDX headers, licenses)
        run: |
          pnpm --filter @tavrn/desktop-electron typecheck
          pnpm --filter @tavrn/desktop-electron test
          scripts/check-spdx.sh
          node scripts/check-js-licenses.mjs
      - name: Key listener module (fmt, clippy, cargo deny, napi build, crate and node tests under xvfb)
        working-directory: apps/desktop-electron/native/keywatch
        run: |
          # Under xvfb-run the crate's X11 tests run too (the abstract-socket fallback, RECORD with xdotool); without a
          # display they skip themselves.
          (cd ../../../desktop/crates/keywatch && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && xvfb-run -a cargo test --locked)
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo deny check
          pnpm run build
          xvfb-run -a pnpm test
      - name: Passkeys module (fmt, clippy, cargo deny, the mapping against a software authenticator, napi build, node test)
        working-directory: apps/desktop-electron/native/passkeys
        run: |
          # The crate's tests build webauthn-rs and the software authenticator with a vendored OpenSSL (tests only).
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p tavrn-fido --locked
          cargo deny check
          pnpm run build
          pnpm test
      - name: Packages (.AppImage, .deb, latest-linux.yml)
        run: |
          # The working directory outlives the job on a self-hosted runner only in its cache slot: start clean.
          rm -rf apps/desktop-electron/release
          pnpm --filter @tavrn/desktop-electron package
          ls -l apps/desktop-electron/release
      # Collected, hashed and uploaded before the specs download and run anything (the node binary, Chromium, livekit):
      # what release-assets signs is what the packaging produced.
      - name: Collect the packages (with their SHA-256 sums)
        run: |
          mkdir -p dist-electron
          cp apps/desktop-electron/release/*.AppImage apps/desktop-electron/release/*.deb apps/desktop-electron/release/latest-linux.yml dist-electron/
          node apps/desktop/scripts/checksums.mjs dist-electron
          ls -l dist-electron
      - id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-electron-a${{ github.run_attempt }}
          path: dist-electron/
          retention-days: 7
      - name: Tools of the specs (Chromium's libraries, just, livekit-server)
        if: ${{ runner.environment == 'github-hosted' }}
        env:
          JUST_VERSION: "1.58.0"
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          pnpm --filter @tavrn/desktop-electron exec playwright install --with-deps chromium
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          # just from its release, checked against the pinned SHA-256 (the runner image's version).
          if ! command -v just >/dev/null; then
            file="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            curl -fsSLo "$RUNNER_TEMP/$file" "https://github.com/casey/just/releases/download/${JUST_VERSION}/$file"
            echo "$JUST_SHA256  $RUNNER_TEMP/$file" | sha256sum -c --quiet -
            tar -xzf "$RUNNER_TEMP/$file" -C "$bin" just
          fi
          # livekit-server, checked against the sums of the justfile.
          PATH="$bin:$PATH" LIVEKIT_INSTALL_DIR="$bin" just livekit-install
          echo "$bin" >> "$GITHUB_PATH"
      # The node runs as a process of the job (the Playwright config starts it with E2E_NODE_BIN), copied out of the
      # node image (the self-hosted runners reach Docker only through the stack's DinD, whose network is not the job's);
      # voice through the livekit-server of the runner image.
      # The node image: for a release, a release image pinned by digest (vars.TAVRN_RELEASE_NODE_IMAGE, no default:
      # the check below fails without it, docs/GITHUB.md "Variables"); otherwise the edge image of tavrn-node's main.
      - name: Playwright specs (the full smoke test of the AppImage; the shell's and the services' specs, the real keyring)
        env:
          GHCR_TOKEN: ${{ github.token }}
          NODE_IMAGE: ${{ inputs.release-tag && vars.TAVRN_RELEASE_NODE_IMAGE || 'ghcr.io/just-tavrn/tavrn-node:edge' }}
        run: |
          if [ -n "$RELEASE_TAG" ] && [[ "$NODE_IMAGE" != *@sha256:* ]]; then
            echo "::error::a release tests against a node image pinned by digest (vars.TAVRN_RELEASE_NODE_IMAGE = <image>@sha256:…), not $NODE_IMAGE"; exit 1
          fi
          bin="$RUNNER_TEMP/tavrn-node-bin"
          mkdir -p "$bin"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$NODE_IMAGE"
          cid="$(docker create "$NODE_IMAGE")"
          docker cp "$cid:/usr/local/bin/tavrn-node" "$bin/tavrn-node"
          docker rm -f "$cid" >/dev/null
          docker logout ghcr.io
          "$bin/tavrn-node" --version
          # A copy of the uploaded AppImage: nothing of the specs writes to the packages.
          mkdir -p "$RUNNER_TEMP/spec-app"
          cp dist-electron/*.AppImage "$RUNNER_TEMP/spec-app/"
          app="$(ls "$RUNNER_TEMP"/spec-app/*.AppImage)"
          cd apps/desktop-electron
          # The development build for the specs that reach the main process (the packages keep --inspect off).
          node node_modules/electron/install.js
          export E2E_NODE_BIN="$bin/tavrn-node" E2E_ELECTRON_APP="$app" XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          # The app always runs with Chromium's sandbox, which needs unprivileged user namespaces (the setuid helper is
          # out: the runner forbids new privileges). A runner that cannot create them (Docker's default seccomp
          # profile; just-tavrn/.github runner/README.md "Security") skips the specs loudly instead of switching the
          # sandbox off; the packages above are built either way. GitHub-hosted runners can (sysctl above).
          if ! unshare -U true 2>/dev/null; then
            echo "::warning title=Electron specs skipped::this runner cannot create user namespaces, so Chromium's sandbox cannot start; the runner stack needs seccomp=unconfined for the runner service (runner/README.md)"
            exit 0
          fi
          # A D-Bus session of its own with an unlocked gnome-keyring: the keychain spec uses the real Secret Service.
          env -u WAYLAND_DISPLAY -u ELECTRON_RUN_AS_NODE xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c \
            'echo ci-keyring | gnome-keyring-daemon --components=secrets --daemonize --unlock >/dev/null && pnpm exec playwright test --config e2e/playwright.config.ts'
      # The specs retry once in CI as a safety net; a test that passed only on its retry is counted here ("N flaky" in
      # the job summary, an annotation per test), so a retry never passes silently.
      - name: Flaky Playwright specs
        if: ${{ always() }}
        run: node scripts/playwright-flaky.mjs apps/desktop-electron/test-results/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: desktop-linux-electron-screenshots-a${{ github.run_attempt }}
          path: apps/desktop-electron/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Tauri NSIS installer cross-compiled on tavrn-heavy (docs/DESKTOP.md "Builds and releases"): trusted events only,
  # never for release tags (the windows job builds the release installers with the updater signatures). The
  # Microsoft CRT and Windows SDK come from the runner's cache; the job never downloads them.
  windows-nsis:
    name: Desktop (Windows NSIS, cross-compiled)
    if: >-
      ${{ vars.CI_ENABLED == 'true' && !inputs.release-tag &&
          github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' &&
          !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: [self-hosted, linux, x64, tavrn-heavy]
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Windows SDK and tools from the runner
        run: |
          if [ -z "${XWIN_CACHE_DIR:-}" ]; then
            echo "::error::XWIN_CACHE_DIR is not set: this runner has no prepared cargo-xwin cache (just-tavrn/.github, runner/README.md \"Desktop builds\"); the job does not download the Windows SDK itself"
            exit 1
          fi
          done_marker="$XWIN_CACHE_DIR/xwin/DONE"
          if [ ! -s "$done_marker" ]; then
            echo "::error::no Windows SDK in $XWIN_CACHE_DIR/xwin (no DONE marker): the runner's start-up download failed (its log says \"cargo-xwin cache download failed\"); restart the runner stack, the job does not download the SDK itself"
            exit 1
          fi
          for arch in ${XWIN_ARCH//,/ }; do
            head -n1 "$done_marker" | grep -qw -- "$arch" || { echo "::error::the cached SDK lacks the architecture $arch (XWIN_ARCH=$XWIN_ARCH)"; exit 1; }
          done
          missing=()
          for t in cargo-xwin makensis clang lld-link llvm-lib llvm-rc file; do
            command -v "$t" >/dev/null || missing+=("$t")
          done
          rustup target list --installed | grep -qx x86_64-pc-windows-msvc || missing+=("rust target x86_64-pc-windows-msvc")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not in the runner image (just-tavrn/.github, runner/Dockerfile): ${missing[*]}"; exit 1
          fi
          echo "SDK: $(head -n1 "$done_marker") in $XWIN_CACHE_DIR/xwin"
          cargo xwin --version && makensis -VERSION && echo
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - name: Build (NSIS, cargo-xwin)
        run: |
          target="${CARGO_TARGET_DIR:-$PWD/apps/desktop/src-tauri/target}/x86_64-pc-windows-msvc/release"
          echo "DESKTOP_TARGET=$target" >> "$GITHUB_ENV"
          # The target directory of the cache slot outlives the job: no installers of earlier builds in the artifact.
          rm -rf "$target/bundle"
          pnpm --filter @tavrn/desktop tauri build --target x86_64-pc-windows-msvc --runner cargo-xwin --bundles nsis
      - name: Collect the installer
        run: |
          file "$DESKTOP_TARGET/tavrn.exe" | grep -q 'PE32+ executable.*x86-64' || { echo "::error::tavrn.exe is not a 64-bit Windows executable"; exit 1; }
          mkdir -p dist-desktop
          cp "$DESKTOP_TARGET"/bundle/nsis/*-setup.exe dist-desktop/
          file dist-desktop/*
          ls -l dist-desktop
      # Only the installer: never the target directory or XWIN_CACHE_DIR (Microsoft's SDK must not be published).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-nsis-a${{ github.run_attempt }}
          path: dist-desktop/
          retention-days: 7

  # The Tauri installers: the .msi needs WiX, which runs on Windows only: windows-latest for release tags (the release
  # installers, .msi and NSIS) and by hand (`windows: true`, also a cross-check of the cross-compiled NSIS). Built
  # without the updater key: release-assets signs the finished installers (the updater signature covers the whole
  # installer file, so signing after the build is the same signature `createUpdaterArtifacts` would write).
  windows:
    name: Desktop (Windows)
    if: ${{ vars.CI_ENABLED == 'true' && (inputs.windows || inputs.release-tag) }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 75
    outputs:
      artifact-id: ${{ steps.installers.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build (.msi, NSIS)
        run: |
          extra=()
          # A pre-release (1.2.3-rc.1): the MSI's product version must be numeric, so it gets 1.2.3 (the file name keeps
          # the full version).
          version="$(node -p "require('./web/package.json').version")"
          if [[ "$version" == *-* ]]; then
            extra+=(--config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"${version%%-*}\"}}}}")
          fi
          pnpm --filter @tavrn/desktop tauri build --bundles msi,nsis "${extra[@]}"
      - name: Collect the installers
        run: |
          mkdir -p dist-desktop
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist-desktop/
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe dist-desktop/
          ls -l dist-desktop
      - id: installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-a${{ github.run_attempt }}
          path: dist-desktop/
          retention-days: 7

  # The Tauri app for macOS (docs/DESKTOP.md "macOS"): one universal build (Apple Silicon and Intel), the disk image
  # Tavrn_<version>_universal.dmg and the app archive Tavrn_<version>_universal.app.tar.gz that the updater installs
  # (release-assets signs it with the update key like the Windows installers; no key here). Not signed with an Apple
  # Developer ID and not notarized: the bundle is signed ad hoc only ("-"), so Gatekeeper asks once instead of calling
  # the app damaged. Nobody of the maintainers has a Mac: continue-on-error, so a failure here never fails a release
  # (release-assets then publishes no macOS files); a contributor with a Mac verifies the result (help wanted).
  macos:
    name: Desktop (macOS, universal, unsigned)
    if: ${{ vars.CI_ENABLED == 'true' && (inputs.macos || inputs.release-tag) }}
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.bundles.outputs.artifact-id }}
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain with both macOS targets (the universal build)
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build (universal .app and .dmg, signed ad hoc)
        run: pnpm --filter @tavrn/desktop tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Collect the disk image and the app archive
        run: |
          version="$(node -p "require('./web/package.json').version")"
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-macos
          cp "$bundle/dmg/Tavrn_${version}_universal.dmg" dist-macos/
          # The updater's archive: the .app at its root, without macOS' AppleDouble files.
          COPYFILE_DISABLE=1 tar -czf "dist-macos/Tavrn_${version}_universal.app.tar.gz" -C "$bundle/macos" Tavrn.app
          lipo -archs "$bundle/macos/Tavrn.app/Contents/MacOS/tavrn"
          ls -l dist-macos
      - id: bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-a${{ github.run_attempt }}
          path: dist-macos/
          retention-days: 7

  # The Electron shell for Windows: the fallback for computers where WebView2 causes trouble (the Tauri installer stays
  # the recommended one). An NSIS installer per user, `tavrn-electron_<version>_x64-setup.exe` (the download page tells
  # the two Windows builds apart by "electron" in the name), its block map and the feed latest.yml; the key listener's
  # Node-API module built here with the MSVC toolchain. Not code-signed yet (docs/DESKTOP.md "Builds and releases").
  # The shell's tests run in linux-electron; this job builds and checks the package only.
  windows-electron:
    name: Desktop (Windows, Electron fallback)
    if: ${{ vars.CI_ENABLED == 'true' && (inputs.electron-windows || inputs.release-tag) }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop-electron/native/keywatch -> target
      - run: pnpm install --frozen-lockfile
      - name: Web client (web/dist, bundled into the app)
        run: pnpm --filter @tavrn/web build
      - name: Key listener module (napi build for windows-x64)
        run: pnpm --filter @tavrn/keywatch-native build
      - name: Package (NSIS, latest.yml)
        env:
          # Unsigned for now: electron-builder must not look for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          rm -rf apps/desktop-electron/release
          pnpm --filter @tavrn/desktop-electron package:win
          ls -l apps/desktop-electron/release
      - name: Collect the installer
        run: |
          version="$(node -p "require('./web/package.json').version")"
          exe="tavrn-electron_${version}_x64-setup.exe"
          cd apps/desktop-electron/release
          for f in "$exe" "$exe.blockmap" latest.yml; do
            [ -s "$f" ] || { echo "::error::electron-builder wrote no $f (electron-builder.config.mjs, nsis.artifactName)"; exit 1; }
          done
          grep -q "url: $exe" latest.yml || { echo "::error::latest.yml does not name $exe"; cat latest.yml; exit 1; }
          mkdir -p ../../../dist-electron-windows
          cp "$exe" "$exe.blockmap" latest.yml ../../../dist-electron-windows/
          ls -l ../../../dist-electron-windows
      - id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-electron-a${{ github.run_attempt }}
          path: dist-electron-windows/
          retention-days: 7

  # The Android app (docs/ANDROID.md): the same Tauri shell built for Android, the APK for 64-bit ARM only (phones of
  # the last decade; the emulator's x86_64 is a development build), release-built but unsigned: the signing key is a
  # secret of the environment `release` and only release-assets signs (apksigner). No secret here, no cache of a release.
  android:
    name: Android (APK, arm64)
    if: ${{ vars.CI_ENABLED == 'true' && (inputs.android || inputs.release-tag) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.apk.outputs.artifact-id }}
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain with the Android target
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android
      - name: Android NDK (pinned) and Java 21
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Web client (web/dist, bundled into the app)
        run: pnpm --filter @tavrn/web build
      - name: Build (release, unsigned, aarch64)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: pnpm --filter @tavrn/desktop tauri android build --apk --target aarch64 --config '{"build":{"beforeBuildCommand":""}}'
      - name: Kotlin unit tests (push notifications as the service worker shows them)
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest
      - name: Collect the APK
        run: |
          version="$(node -p "require('./web/package.json').version")"
          apk="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n1)"
          [ -s "$apk" ] || { echo "::error::no unsigned release APK"; exit 1; }
          mkdir -p dist-android
          cp "$apk" "dist-android/Tavrn_${version}_android-arm64-unsigned.apk"
          ls -l dist-android
      - id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-android-a${{ github.run_attempt }}
          path: dist-android/
          retention-days: 7

  # The only job that writes and the only one that holds the updater key (environment `release`: tags v*, a required
  # reviewer; docs/GITHUB.md "Releases"). It signs the Tauri installers (<installer>.sig, read by the Tauri updater
  # through latest.json) and the Electron feeds (latest-linux.yml, latest.yml: <feed>.minisig, checked by the apps
  # before they offer an update) with the updater key, writes a <asset>.sha256 for every installer and latest.json,
  # verifies every signature with the public key of tauri.conf.json, attests the build provenance of the assets,
  # checks the complete set against the names the website's download page expects (apps/desktop/scripts/
  # release-assets.mjs) and attaches it to the release release.yml created. Its inputs: the artifacts desktop-windows
  # (every artifact name carries the run attempt, "-a<N>": a re-run uploads under a new name, and the download by id
  # keeps only one artifact per name, so a re-run after a flaky build job would otherwise miss its own artifact)
  # (Tauri), desktop-linux-electron and desktop-windows-electron, all built from the tag on GitHub-hosted runners by
  # jobs without secrets. It installs only the Tauri CLI, without lifecycle scripts, and runs no build and no cargo
  # (apps/desktop/scripts/release-workflow.test.mjs).
  release-assets:
    name: Release assets (installers, checksums, signatures)
    # macOS is optional (continue-on-error): every other build job must have succeeded, whatever became of macos.
    if: >-
      ${{ !cancelled() && vars.CI_ENABLED == 'true' && inputs.release-tag
      && needs.linux-electron.result == 'success' && needs.windows-electron.result == 'success'
      && needs.windows.result == 'success' && needs.android.result == 'success' }}
    needs: [linux-electron, windows-electron, windows, android, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No Actions cache in the job that holds the key.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Release builds need the owner's updater key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q REPLACE_WITH_THE_OWNERS_MINISIGN_PUBLIC_KEY apps/desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json still carries the placeholder public key (docs/DESKTOP.md, Updates)" >&2; exit 1
          fi
          [ -n "$KEY" ] || { echo "the secret TAURI_SIGNING_PRIVATE_KEY of the environment release is missing (docs/GITHUB.md)" >&2; exit 1; }
      # Each build job's artifact by the id its upload step reported (never by name: a later step of a build job could
      # upload another artifact of that name), into a directory of its own; then only the files that job may deliver
      # go into installers/ (apps/desktop/scripts/release-assets.mjs `collect`: no signature, no other job's file).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact-id }}
          path: built/tauri
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.linux-electron.outputs.artifact-id }}
          path: built/linux
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows-electron.outputs.artifact-id }}
          path: built/electron-windows
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.android.outputs.artifact-id }}
          path: built/android
          merge-multiple: true
      # macOS only when its build uploaded (it may fail without failing the release: then no macOS files).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.macos.outputs.artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact-id }}
          path: built/macos
          merge-multiple: true
      - name: Only the files each build job may deliver
        run: |
          node apps/desktop/scripts/release-assets.mjs collect "$RELEASE_TAG" installers \
            tauri=built/tauri linux=built/linux electron-windows=built/electron-windows android=built/android macos=built/macos
      - name: The Linux packages are the ones hashed at packaging
        working-directory: installers
        run: sha256sum -c ./*.AppImage.sha256 ./*.deb.sha256
      # The signer (the Tauri CLI, pinned by the lockfile): only the package that carries it, without lifecycle scripts
      # (the CLI is a prebuilt Node-API module and needs none).
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tavrn/desktop
      - name: Sign the Tauri installers (<installer>.sig) and the Electron feeds (<feed>.minisig)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${RELEASE_TAG#v}"
          shopt -s nullglob
          installers=()
          for f in installers/*.msi installers/*-setup.exe installers/*.app.tar.gz; do
            [[ "$(basename "$f")" == *electron* ]] || installers+=("$f")
          done
          [ "${#installers[@]}" -gt 0 ] || { echo "::error::no Tauri installer in the artifact desktop-windows"; exit 1; }
          for f in "${installers[@]}"; do
            # The updater's signature over the whole installer, as `tauri build` writes it with createUpdaterArtifacts.
            pnpm --filter @tavrn/desktop exec tauri signer sign "$GITHUB_WORKSPACE/$f" >/dev/null
          done
          for feed in latest-linux.yml latest.yml; do
            # The trusted comment names the file and the version; the apps check both (apps/desktop-electron/src/main/updater.ts).
            pnpm --filter @tavrn/desktop exec tauri signer sign --app-version "$version" "$GITHUB_WORKSPACE/installers/$feed" >/dev/null
            # The CLI writes the minisign signature base64-encoded once more (<feed>.sig): the plain minisign file is published.
            base64 -d "installers/$feed.sig" > "installers/$feed.minisig"
            rm "installers/$feed.sig"
          done
      # The APK with the owner's Android key (the keystore of the environment `release`; docs/ANDROID.md "Releases"),
      # by the runner image's apksigner (Android SDK build-tools, nothing installed). Android installs an update only
      # with the same certificate; vars.ANDROID_CERT_SHA256 (optional) pins it, so a wrong keystore fails here.
      - name: Sign the APK (apksigner)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "the secret ANDROID_KEYSTORE_B64 of the environment release is missing (docs/ANDROID.md)" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          keystore="$RUNNER_TEMP/tavrn-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          unsigned="installers/Tavrn_${version}_android-arm64-unsigned.apk"
          signed="installers/Tavrn_${version}_android-arm64.apk"
          "$tools/zipalign" -c -P 16 4 "$unsigned" || { "$tools/zipalign" -f -P 16 4 "$unsigned" "$unsigned.aligned" && mv "$unsigned.aligned" "$unsigned"; }
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD --out "$signed" "$unsigned"
          rm -f "$keystore" "$unsigned" "$signed.idsig"
          "$tools/apksigner" verify --print-certs "$signed" | tee "$RUNNER_TEMP/apk-certs.txt"
          if [ -n "$CERT_SHA256" ]; then
            want="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
            grep -q "certificate SHA-256 digest: $want" "$RUNNER_TEMP/apk-certs.txt" || { echo "::error::the APK is not signed with the certificate of vars.ANDROID_CERT_SHA256"; exit 1; }
          fi
      - name: Checksums, latest.json, the signatures and the asset check
        run: |
          # <asset>.sha256 (sha256sum format) for every installer; the update feeds carry their own hashes and signatures.
          node apps/desktop/scripts/checksums.mjs installers
          node apps/desktop/scripts/latest-json.mjs installers "$RELEASE_TAG" "$GITHUB_REPOSITORY" \
            "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" > installers/latest.json
          cat installers/latest.json
          # What the apps will check, before anything is uploaded: the key of tauri.conf.json, the file names, the version.
          node apps/desktop-electron/scripts/verify-feed.mjs installers/latest-linux.yml installers/latest.yml
          node apps/desktop/scripts/verify-tauri.mjs installers
          # Exactly the files the download page and the updaters expect, nothing else (docs/DESKTOP.md "Builds and releases").
          node apps/desktop/scripts/release-assets.mjs check "$RELEASE_TAG" installers
          ls -l installers
      # GitHub's build provenance for every installer and feed (docs/DESKTOP.md "Checking a download"). Artifact
      # attestations need a public repository on GitHub's Free plan: skipped while the repository is private.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            installers/*.AppImage
            installers/*.deb
            installers/*.msi
            installers/*.exe
            installers/*.apk
            installers/*.dmg
            installers/*.app.tar.gz
            installers/latest-linux.yml
            installers/latest.yml
            installers/latest.json
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber installers/*
          # The whole release, with the web bundle of release.yml: complete before the website is told.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | node apps/desktop/scripts/release-assets.mjs check-release "$RELEASE_TAG"
