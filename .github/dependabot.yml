version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # The @tavrn packages are git dependencies by tag during the private phase; they move with the release train.
      - dependency-name: "@tavrn/*"
      # TypeScript 7 (the Go compiler) breaks @hey-api/openapi-ts, which generates the SDK types.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  # The Rust crates of the desktop shells: the Tauri app and the key listener crate shared with the Electron shell
  # and its Node-API module (three Cargo workspaces with their own lockfiles).
  - package-ecosystem: cargo
    directories:
      - /apps/desktop/src-tauri
      - /apps/desktop/crates/keywatch
      - /apps/desktop-electron/native/keywatch
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Test-only: the passkey JSON must stay what tavrn-node's webauthn-rs reads (src/passkey.rs tests), so it moves
      # together with tavrn-node's webauthn-rs, currently 0.6 (0.x minor versions are breaking).
      - dependency-name: webauthn-rs-proto
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
